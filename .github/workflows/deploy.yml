name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11  # lockfile is written by npm 11; Node 22 ships npm 10, whose `npm ci` rejects it
      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.128.0"  # action defaults to wrangler 3.90.0, which now exits 1 before running
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=phareim-no

      - name: Notify Sleeper
        if: success()
        env:
          SLEEPER_API_KEY: ${{ secrets.SLEEPER_API_KEY }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          jq -n --arg body "$COMMIT_MESSAGE" '{title: "phareim.no deployed", body: $body}' \
            | curl -fsS -X POST https://sleeper.phareim.no/tasks/notify \
              -H "Authorization: Bearer $SLEEPER_API_KEY" \
              -H "Content-Type: application/json" \
              --data-binary @-
